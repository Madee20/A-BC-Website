<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a63"/>
      <stop offset="55%" stop-color="#0f2745"/>
      <stop offset="100%" stop-color="#0a1c33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a9782f"/>
      <stop offset="45%" stop-color="#e0b45c"/>
      <stop offset="75%" stop-color="#f3d68c"/>
      <stop offset="100%" stop-color="#c9922f"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0b45c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9922f" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="168" height="168" rx="30" fill="url(#navyGrad)"/>
  <rect x="6" y="6" width="168" height="168" rx="30" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="14" y="14" width="152" height="152" rx="24" fill="none" stroke="#f3d68c" stroke-opacity="0.22" stroke-width="1"/>

  <!-- bar chart, ascending -->
  <rect x="52" y="112" width="15" height="34" rx="2" fill="url(#barGrad)"/>
  <rect x="75" y="96" width="15" height="50" rx="2" fill="url(#barGrad)"/>
  <rect x="98" y="80" width="15" height="66" rx="2" fill="url(#barGrad)"/>
  <rect x="121" y="66" width="15" height="80" rx="2" fill="url(#barGrad)"/>

  <!-- upward trend arrow -->
  <path
    d="M 40 122 C 58 130, 76 122, 90 104 C 104 86, 112 66, 122 50"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="13"
    stroke-linecap="round"
  />
  <polygon points="107,36 142,32 130,66" fill="url(#goldGrad)"/>
</svg>
